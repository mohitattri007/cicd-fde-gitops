
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-agent-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support-agent-api
  template:
    metadata:
      labels:
        app: support-agent-api
    spec:
      containers:
        - name: api
          image: ghcr.io/mohitattri007/cicd-fde-demo:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: support-agent-api
spec:
  selector:
    app: support-agent-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
